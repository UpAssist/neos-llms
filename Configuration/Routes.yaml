-
  name: 'llms.txt'
  uriPattern: '{node}llms.txt'
  defaults:
    '@package':    'Neos.Neos'
    '@controller': 'Frontend\Node'
    '@action':     'show'
    '@format':     'txt.llms'
  routeParts:
    'node':
      handler: 'Neos\Neos\FrontendRouting\FrontendNodeRoutePartHandlerInterface'
      options:
        onlyMatchSiteNodes: true
        # The site's own uriPathSuffix (e.g. '.html') must not apply to llms.txt
        uriPathSuffix: ''
  appendExceedingArguments: true
